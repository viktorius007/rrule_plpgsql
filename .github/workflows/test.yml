name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install plpgsql_check extension
        run: |
          CONTAINER_ID="${{ job.services.postgres.id }}"
          echo "Installing plpgsql_check in postgres service container: $CONTAINER_ID"
          docker exec --user root "$CONTAINER_ID" bash -lc \
            "apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y postgresql-17-plpgsql-check"
          docker exec "$CONTAINER_ID" psql -U postgres -d postgres -c \
            "ALTER SYSTEM SET shared_preload_libraries = 'plpgsql_check';"
          docker restart "$CONTAINER_ID" > /dev/null
          for i in {1..30}; do
            if psql -d postgres -c "SELECT 1" > /dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          psql -d postgres -c "CREATE EXTENSION IF NOT EXISTS plpgsql_check;"

      - name: Run test suite (standard + sub-day)
        env:
          DATABASE_URL: rrule_test
        run: ./test.sh --both

      - name: Run package SQL export contract tests
        env:
          DATABASE_URL: rrule_test
        run: npm run test:package-contract

      - name: Run PL/pgSQL linter
        run: ./lint.sh

      - name: Run SQL coding standards linter
        run: ./lint-tests.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r tests/property/requirements.txt

      - name: Prepare database for property tests
        run: |
          psql -d postgres -c "DROP DATABASE IF EXISTS rrule_test"
          psql -d postgres -c "CREATE DATABASE rrule_test"
          psql -d rrule_test -f src/install.sql

      - name: Run property tests (non-stateful)
        env:
          PGDATABASE: rrule_test
        run: pytest tests/property/ -v -k "not stateful_model" --hypothesis-profile=ci --hypothesis-seed=${{ github.run_id }}

      - name: Run stateful model property tests
        env:
          PGDATABASE: rrule_test
        run: pytest tests/property/test_stateful_model.py -v --hypothesis-profile=stateful_ci --hypothesis-seed=424242

      - name: Generate branch coverage report
        run: node scripts/coverage-report.js --json > /dev/null

      - name: Generate statement coverage report (standard)
        run: ./scripts/profiler-coverage.sh --install-mode standard --report coverage-report-standard.txt

      - name: Generate statement coverage report (subday)
        run: ./scripts/profiler-coverage.sh --install-mode subday --report coverage-report-subday.txt

      - name: Enforce coverage gates
        run: node scripts/check-coverage-gates.js

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage-report.json
            coverage-report-standard.txt
            coverage-report-subday.txt
          if-no-files-found: ignore
