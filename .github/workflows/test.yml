name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Install plpgsql_check extension
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-17-plpgsql-check || \
          sudo apt-get install -y postgresql-plpgsql-check

      - name: Run test suite (standard + sub-day)
        env:
          DATABASE_URL: rrule_test
        run: ./test.sh --both

      - name: Run package SQL export contract tests
        env:
          DATABASE_URL: rrule_test
        run: npm run test:package-contract

      - name: Run PL/pgSQL linter
        run: ./lint.sh

      - name: Run SQL coding standards linter
        run: ./lint-tests.sh

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: pip install -r tests/property/requirements.txt

      - name: Prepare database for property tests
        run: |
          psql -d postgres -c "DROP DATABASE IF EXISTS rrule_test"
          psql -d postgres -c "CREATE DATABASE rrule_test"
          psql -d rrule_test -f src/install.sql

      - name: Run property tests
        env:
          PGDATABASE: rrule_test
        run: pytest tests/property/ -v --hypothesis-profile=ci --hypothesis-seed=${{ github.run_id }}

      - name: Generate coverage report
        run: ./scripts/profiler-coverage.sh || true
        continue-on-error: true

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage-report.txt
          if-no-files-found: ignore
